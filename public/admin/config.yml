# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS config. The one-time setup (GitHub OAuth app + auth worker) is
# done — see HANDBOOK.md Part 5 for current state and the remaining cutover step.
#
# Nothing here names a user. Eric's access comes entirely from being a GitHub
# collaborator on the repo below, plus the worker's ALLOWED_DOMAINS allowing the
# origin he loads /admin from. Adding or removing an editor is a GitHub and
# Cloudflare change, never a change to this file.
#
# Field constraints here must mirror src/content.config.ts — a Zod violation is
# a hard build failure that Eric never sees. See HANDBOOK.md Part 5.

backend:
  name: github
  repo: bkelly466/CustomCounseling
  branch: main
  base_url: https://sveltia-cms-auth.brandonkelly466.workers.dev

media_folder: public/images/uploads
public_folder: /images/uploads

# Home, About, and Site Settings are one-off files, not repeatable lists,
# so they're modeled as singletons — they show up directly in the sidebar
# and Eric can't accidentally create duplicates or delete them.
singletons:
  - name: home
    label: Home Page
    icon: home
    file: src/content/pages/home.md
    fields:
      - {
          name: title,
          label: "Internal Title (not shown on the page)",
          widget: string,
        }
      - {
          name: heroSlogan,
          label: "Hero Slogan",
          widget: string,
          hint: "The large headline over the home-page hero photo.",
        }
      - {
          name: heroTagline,
          label: "Hero Tagline",
          widget: string,
          hint: "The smaller line under the hero slogan.",
        }
      # There is deliberately no "SEO Description" field on any page here.
      # Titles and meta descriptions are code-owned, in src/lib/seo.ts. The
      # field used to exist on Home, About, and Online Sessions, but only Online
      # Sessions ever read it — the other two published edits that changed
      # nothing on the live site. See docs/adr/0003-code-owned-page-metadata.md.
      #
      # editor_components defaults to ALL built-ins, which includes `image` —
      # that uploads into public/images/uploads, bypassing Astro's <Image>
      # optimization and putting the 100 Performance score at the mercy of
      # whatever file gets dragged in. Empty list disables it: new images go
      # through Brandon and the optimized path.
      #
      # The button list is restricted to what the CSS actually styles.
      # Excluded on purpose: heading-one (every page already has an H1 — a
      # second one is an accessibility and SEO regression), heading-four
      # through -six, quote, and code (no styles exist for them in
      # src/styles/global.css, so they'd render unstyled).
      #
      # Repeated verbatim on every richtext field below rather than using a
      # YAML anchor — if Sveltia's parser ever disagreed about aliases, the
      # blast radius is Eric's entire editing screen.
      - {
          name: body,
          label: "Intro Text",
          widget: richtext,
          editor_components: [],
          buttons:
            [
              bold,
              italic,
              link,
              heading-two,
              heading-three,
              bulleted-list,
              numbered-list,
            ],
        }

  # Online Sessions. Only the prose is here — the section headings, the numbered
  # circles, the photo, and the page layout stay in src/pages/telehealth.astro.
  - name: telehealth
    label: Online Sessions Page
    icon: videocam
    file: src/content/pages/telehealth.md
    fields:
      - {
          name: title,
          label: "Internal Title (not shown on the page)",
          widget: string,
        }
      - {
          name: body,
          label: "Opening paragraphs",
          widget: richtext,
          editor_components: [], # no image uploads — see note on Home's body
          buttons:
            [
              bold,
              italic,
              link,
              heading-two,
              heading-three,
              bulleted-list,
              numbered-list,
            ],
        }
      - {
          name: firstSessionSteps,
          label: "What a first session looks like",
          widget: list,
          field: { name: step, label: Step, widget: text },
          hint: "Numbered automatically, in this order. Three works best on the page.",
        }
      - {
          name: checklist,
          label: "What you need",
          widget: list,
          field: { name: item, label: Item, widget: string },
          hint: "Short items — each sits on one line next to a dot.",
        }
      - {
          name: couplesBody,
          label: "Answer: Couples over video",
          widget: text,
        }
      - { name: privacyBody, label: "Answer: Is it private?", widget: text }
      - {
          name: techFailureBody,
          label: "Answer: What if the tech acts up?",
          widget: text,
        }

  - name: about
    label: About Page
    icon: person
    file: src/content/pages/about.md
    fields:
      - {
          name: title,
          label: "Internal Title (not shown on the page)",
          widget: string,
        }
      - {
          name: funList,
          label: "What I like to do for fun",
          widget: list,
          field: { name: item, label: Item, widget: string },
          hint: "Shown as a bulleted list, in this order. Keep each one to a line.",
        }
      - {
          name: body,
          label: "Bio",
          widget: richtext,
          editor_components: [], # no image uploads — see note on Home's body
          buttons:
            [
              bold,
              italic,
              link,
              heading-two,
              heading-three,
              bulleted-list,
              numbered-list,
            ],
        }

  # The five service pillar pages. Each one is a singleton because the page is a
  # fixed route in src/pages — Eric edits its words, he does not create or delete
  # it. These are NOT the same thing as the "Services" collection further down:
  # that one holds the short summary cards shown on Home and /services. A page
  # and its card are edited in two places on purpose — the card copy is quoted
  # in the page's structured data (src/lib/seo.ts) and by "Other ways I can
  # help", so it has to stay short.
  #
  # No page here exposes its big headline (the H1). That line is written against
  # the page's search-result title in src/lib/seo.ts and the two work as a pair —
  # see docs/adr/0004-seo-strategy-branded-and-long-tail.md. Section headings,
  # layout, and photos are code-owned for the same reason they are everywhere
  # else: Eric owns the words, the design stays put.
  - name: mens_counseling
    label: Men's Counseling Page
    icon: man
    file: src/content/pages/mens-counseling.md
    fields:
      - {
          name: title,
          label: "Internal Title (not shown on the page)",
          widget: string,
        }
      - {
          name: heroSubhead,
          label: "Subhead (the line under the big headline)",
          widget: string,
        }
      - {
          name: body,
          label: "Opening paragraphs",
          widget: richtext,
          editor_components: [], # no image uploads — see note on Home's body
          buttons:
            [
              bold,
              italic,
              link,
              heading-two,
              heading-three,
              bulleted-list,
              numbered-list,
            ],
        }
      - name: workOnList
        label: "What we can work on"
        widget: list
        summary: "{{fields.text}}"
        hint: "Shown as a two-column bulleted list, in this order. Add a link only when the item names another page on this site."
        fields:
          - { name: text, label: Item, widget: string }
          # A dropdown, never free text: a typed URL would be a dead internal
          # link that nothing catches at build time.
          #
          # The option list is repeated on the Veterans page rather than shared
          # through a YAML anchor, for the same reason the richtext button lists
          # above are — see the note on Home's body.
          - name: link
            label: "Link to (optional)"
            widget: select
            required: false
            options:
              - { label: "No link", value: "" }
              - { label: "Men's Counseling", value: "/mens-counseling" }
              - { label: "Couples Counseling", value: "/couples-counseling" }
              - { label: "Addiction Counseling", value: "/addiction-counseling" }
              - { label: "Anxiety & Depression", value: "/anxiety-and-depression" }
              - { label: "Counseling for Veterans", value: "/veterans" }
              - { label: "How Online Sessions Work", value: "/telehealth" }
      - {
          name: closingBody,
          label: "Closing paragraphs (under “No couch. No waiting room.”)",
          widget: text,
          hint: "Leave a blank line between paragraphs.",
        }

  - name: couples_counseling
    label: Couples Counseling Page
    icon: favorite
    file: src/content/pages/couples-counseling.md
    fields:
      - {
          name: title,
          label: "Internal Title (not shown on the page)",
          widget: string,
        }
      - {
          name: heroSubhead,
          label: "Subhead (the line under the big headline)",
          widget: string,
        }
      - {
          name: body,
          label: "Opening paragraphs",
          widget: richtext,
          editor_components: [], # no image uploads — see note on Home's body
          buttons:
            [
              bold,
              italic,
              link,
              heading-two,
              heading-three,
              bulleted-list,
              numbered-list,
            ],
        }
      - {
          name: questions,
          label: "Questions to ask yourself",
          widget: list,
          field: { name: question, label: Question, widget: string },
          hint: "Shown as a bulleted list above the photo, in this order.",
        }
      - {
          name: approachBody,
          label: "Section: A focused 8–12 week approach",
          widget: text,
          hint: "Leave a blank line between paragraphs.",
        }
      - {
          name: videoBody,
          label: "Section: How it works over video",
          widget: text,
          hint: "The “See how online sessions work” link under this is added automatically.",
        }

  - name: addiction_counseling
    label: Addiction Counseling Page
    icon: healing
    file: src/content/pages/addiction-counseling.md
    fields:
      - {
          name: title,
          label: "Internal Title (not shown on the page)",
          widget: string,
        }
      - {
          name: heroSubhead,
          label: "Subhead (the line under the big headline)",
          widget: string,
        }
      - {
          name: body,
          label: "Opening paragraphs",
          widget: richtext,
          editor_components: [], # no image uploads — see note on Home's body
          buttons:
            [
              bold,
              italic,
              link,
              heading-two,
              heading-three,
              bulleted-list,
              numbered-list,
            ],
        }
      - {
          name: helpWithList,
          label: "What I help with",
          widget: list,
          field: { name: item, label: Item, widget: string },
          hint: "Short items — shown in two columns, in this order.",
        }
      - {
          name: gainsList,
          label: "What you get out of it",
          widget: list,
          field: { name: item, label: Item, widget: string },
          hint: "Shown as a bulleted list, in this order.",
        }
      - {
          name: closingBody,
          label: "Closing paragraphs",
          widget: text,
          hint: "Leave a blank line between paragraphs.",
        }

  - name: anxiety_and_depression
    label: Anxiety & Depression Page
    icon: psychology
    file: src/content/pages/anxiety-and-depression.md
    fields:
      - {
          name: title,
          label: "Internal Title (not shown on the page)",
          widget: string,
        }
      - {
          name: heroSubhead,
          label: "Subhead (the line under the big headline)",
          widget: string,
        }
      - {
          name: body,
          label: "Opening paragraphs",
          widget: richtext,
          editor_components: [], # no image uploads — see note on Home's body
          buttons:
            [
              bold,
              italic,
              link,
              heading-two,
              heading-three,
              bulleted-list,
              numbered-list,
            ],
        }
      - {
          name: anxietySigns,
          label: "Anxiety can look like",
          widget: list,
          field: { name: item, label: Item, widget: string },
          hint: "Left column of the two lists. Five items fits the layout best.",
        }
      - {
          name: depressionSigns,
          label: "Depression can look like",
          widget: list,
          field: { name: item, label: Item, widget: string },
          hint: "Right column. Keep it close in length to the anxiety list.",
        }
      - {
          name: howWeWorkBody,
          label: "Section: How we work on it",
          widget: text,
          hint: "Leave a blank line between paragraphs.",
        }

  - name: veterans
    label: Veterans Page
    icon: military_tech
    file: src/content/pages/veterans.md
    fields:
      - {
          name: title,
          label: "Internal Title (not shown on the page)",
          widget: string,
        }
      - {
          name: heroSubhead,
          label: "Subhead (the line under the big headline)",
          widget: string,
        }
      - {
          name: body,
          label: "Opening paragraphs",
          widget: richtext,
          editor_components: [], # no image uploads — see note on Home's body
          buttons:
            [
              bold,
              italic,
              link,
              heading-two,
              heading-three,
              bulleted-list,
              numbered-list,
            ],
        }
      - name: workOnList
        label: "What we can work on"
        widget: list
        summary: "{{fields.text}}"
        hint: "Shown as a bulleted list, in this order. Add a link only when the item names another page on this site."
        fields:
          - { name: text, label: Item, widget: string }
          # Same list as the Men's Counseling page, repeated on purpose.
          - name: link
            label: "Link to (optional)"
            widget: select
            required: false
            options:
              - { label: "No link", value: "" }
              - { label: "Men's Counseling", value: "/mens-counseling" }
              - { label: "Couples Counseling", value: "/couples-counseling" }
              - { label: "Addiction Counseling", value: "/addiction-counseling" }
              - { label: "Anxiety & Depression", value: "/anxiety-and-depression" }
              - { label: "Counseling for Veterans", value: "/veterans" }
              - { label: "How Online Sessions Work", value: "/telehealth" }
      - {
          name: closingBody,
          label: "Closing paragraphs",
          widget: text,
          hint: "Leave a blank line between paragraphs.",
        }

  - name: settings
    label: Site Settings
    icon: settings
    file: src/content/settings/site.yml
    fields:
      - name: site
        label: Contact Info & Fees
        widget: object
        fields:
          - { name: phone, label: "Phone Number", widget: string }
          # The content schema validates this with z.string().email(); a typo
          # here (missing @, missing .com) fails the build rather than showing
          # a broken address, so catch it in the editor instead.
          - {
              name: email,
              label: "Email Address",
              widget: string,
              pattern:
                [
                  '^[^@\s]+@[^@\s]+\.[^@\s]+$',
                  "Enter a complete email address, e.g. eric@denvercustomcounseling.com",
                ],
            }
          - {
              name: serviceArea,
              label: "Service Area Blurb",
              widget: text,
            }
          - {
              name: responsePromise,
              label: "Response-Time Promise (shown next to the contact form)",
              widget: string,
            }
          - {
              name: feeIndividual,
              label: "Individual Session Fee",
              widget: string,
            }
          - { name: feeCouples, label: "Couples Session Fee", widget: string }
          - {
              name: telehealthDisclaimer,
              label: "Contact Form / Crisis Disclaimer",
              widget: text,
              hint: "Keep the 988 crisis line mentioned here — do not remove.",
            }

# Services and FAQ entries are repeatable — Eric can add, reorder, or
# remove individual items through these collections.
collections:
  - name: services
    label: Services
    label_singular: Service
    icon: medical_services
    folder: src/content/services
    create: true
    slug: "{{fields.title}}"
    fields:
      - { name: title, label: Title, widget: string }
      - {
          name: summary,
          label: "Summary (shown in the services list)",
          widget: text,
        }
      - {
          name: href,
          label: "Page Link (leave as-is; Brandon manages page URLs)",
          widget: string,
          required: false,
        }
      - {
          name: order,
          label: "Display Order (lower numbers show first)",
          widget: number,
          default: 1,
        }
      - {
          name: body,
          label: "Full Description (optional)",
          widget: richtext,
          required: false,
          editor_components: [], # no image uploads — see note on Home's body
          buttons:
            [
              bold,
              italic,
              link,
              heading-two,
              heading-three,
              bulleted-list,
              numbered-list,
            ],
        }

  - name: faq
    label: FAQ
    label_singular: Question
    icon: help
    folder: src/content/faq
    create: true
    slug: "{{fields.question}}"
    fields:
      - { name: question, label: Question, widget: string }
      - {
          name: order,
          label: "Display Order (lower numbers show first)",
          widget: number,
          default: 1,
        }
      - {
          name: body,
          label: Answer,
          widget: richtext,
          editor_components: [], # no image uploads — see note on Home's body
          buttons:
            [
              bold,
              italic,
              link,
              heading-two,
              heading-three,
              bulleted-list,
              numbered-list,
            ],
        }
